appId: com.hamshirago.client
---
# Full app audit — screenshots of all accessible screens
- launchApp:
    clearState: true

- takeScreenshot: 01_onboarding

# Skip onboarding
- tapOn:
    text: ".*Пропустить.*"
    optional: true
- waitForAnimationToEnd

# Language picker — choose Russian
- tapOn:
    text: ".*Русский.*"
    optional: true
- waitForAnimationToEnd

- takeScreenshot: 02_auth_screen

# Login with test credentials
- tapOn:
    id: "auth_phone_input"
- inputText: "+998901234567"
- tapOn:
    id: "auth_password_input"
- inputText: "test1234"
- tapOn:
    id: "auth_submit_button"
- waitForAnimationToEnd

- takeScreenshot: 03_after_login

# If login succeeded, navigate tabs
# Home
- takeScreenshot: 04_home

# Orders tab
- tapOn:
    text: ".*Заказы.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 05_orders

# Profile tab
- tapOn:
    text: ".*Профиль.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 06_profile

# Scroll profile
- scroll
- takeScreenshot: 07_profile_links

# Try loyalty
- tapOn:
    text: ".*бонус.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 08_loyalty
- pressKey: back

# Try subscriptions
- tapOn:
    text: ".*Подписк.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 09_subscriptions
- pressKey: back

# Try consultations
- tapOn:
    text: ".*консультац.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 10_consultations
- pressKey: back

# Try prescriptions
- tapOn:
    text: ".*назначен.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: 11_prescriptions
- pressKey: back
