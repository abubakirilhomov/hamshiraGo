appId: com.hamshirago.client
---
- launchApp:
    clearState: true

- takeScreenshot: 01_auth_screen

# Switch to register mode
- tapOn: "Регистрация"

- takeScreenshot: 02_register_mode

# Fill name
- tapOn:
    id: "auth_name_input"
- inputText: "Тестовый Пользователь"

# Fill phone
- tapOn:
    id: "auth_phone_input"
- inputText: "+998901111111"

# Fill password
- tapOn:
    id: "auth_password_input"
- inputText: "test1234"

- takeScreenshot: 03_register_filled

# Submit
- tapOn:
    id: "auth_submit_button"

- waitForAnimationToEnd

- takeScreenshot: 04_after_register
