appId: com.hamshirago.client
---
- launchApp:
    clearState: true

- takeScreenshot: 01_onboarding

# Skip onboarding
- tapOn:
    text: ".*Пропустить.*"
    optional: true

- waitForAnimationToEnd

# Language picker — choose Russian
- tapOn:
    text: ".*Русский.*"
    optional: true

- waitForAnimationToEnd
- takeScreenshot: 02_after_lang

# Maybe another onboarding or language screen
- tapOn:
    text: ".*Пропустить.*"
    optional: true

- waitForAnimationToEnd
- takeScreenshot: 03_auth_screen

# Enter phone number
- tapOn:
    id: "auth_phone_input"
- inputText: "+998901234567"

# Enter password
- tapOn:
    id: "auth_password_input"
- inputText: "test1234"

- takeScreenshot: 04_auth_filled

# Submit login
- tapOn:
    id: "auth_submit_button"

- waitForAnimationToEnd
- takeScreenshot: 05_after_login
