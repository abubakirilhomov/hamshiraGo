appId: host.exp.Exponent
---
# HamshiraGo FULL Test — restart app fresh

# Reload app to ensure we start from Home
- openLink: "exp://192.168.100.27:8081"
- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 15000

# Dismiss keychain
- runFlow:
    when:
      visible:
        text: ".*е сейчас.*"
    commands:
      - tapOn:
          text: ".*е сейчас.*"

# Skip onboarding if shown
- runFlow:
    when:
      visible:
        text: ".*Keyingi.*"
    commands:
      - tapOn:
          text: ".*Keyingi.*"
      - tapOn:
          text: ".*Keyingi.*"
      - tapOn:
          text: ".*Boshlash.*"

# Language picker if shown
- runFlow:
    when:
      visible: "Davom etish"
    commands:
      - tapOn:
          text: ".*zbekcha.*"
      - tapOn: "Davom etish"

# Auth if shown
- runFlow:
    when:
      visible:
        id: "auth_phone_input"
    commands:
      - tapOn:
          id: "auth_phone_input"
      - inputText: "200099944"
      - tapOn:
          id: "auth_password_input"
      - inputText: "abubakir"
      - tapOn:
          text: ".*Xush.*"
      - tapOn:
          text: ".*Kirish.*|.*Войти.*"
      - runFlow:
          when:
            visible:
              text: ".*е сейчас.*"
          commands:
            - tapOn:
                text: ".*е сейчас.*"
      - extendedWaitUntil:
          visible: "HamshiraGo"
          timeout: 15000

# Final keychain dismiss
- runFlow:
    when:
      visible:
        text: ".*е сейчас.*"
    commands:
      - tapOn:
          text: ".*е сейчас.*"

# ============================================================
# 1. HOME (3 screenshots)
# ============================================================
- takeScreenshot: s01_home
- scroll
- takeScreenshot: s02_home_scroll

# ============================================================
# 2. SERVICE DETAIL — tap first service card
# ============================================================
- tapOn:
    text: ".*UZS.*"
    index: 0
    optional: true
- waitForAnimationToEnd
- takeScreenshot: s03_service_detail
- scroll
- takeScreenshot: s04_service_scroll

# 2b. ORDER LOCATION
